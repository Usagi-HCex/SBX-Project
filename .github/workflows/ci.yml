name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Manager shell tests
        run: bash tests/test_manager.sh
      - name: Static security audit
        run: bash scripts/security-audit.sh
